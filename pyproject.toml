[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-pipeline"
version = "0.1.0"
description = "Shared scraping, parsing, and DB helpers for the UFC stats ETL pipeline."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["ufcPipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
