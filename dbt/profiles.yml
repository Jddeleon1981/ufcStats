# Three targets from day one, so the project is never written against a single
# warehouse. Point dbt at this file with either:
#   dbt build --profiles-dir .        (run from the dbt/ directory)
#   export DBT_PROFILES_DIR=$(pwd)/dbt
#
# No secrets live here: the prod target reads every credential from the
# environment, so this file is safe to commit.
ufc:
  target: dev

  outputs:
    # Local development. A DuckDB file alongside the raw parquet, so models can
    # read data/raw/**.parquet directly without a load step.
    dev:
      type: duckdb
      path: "../data/ufc_dev.duckdb"
      threads: 4
      extensions:
        - parquet

    # Continuous integration. A throwaway file under target/, seeded from the
    # committed CSVs, so a pull request builds and tests the whole DAG with no
    # warehouse and no scrape. target/ is gitignored and dbt clean wipes it, so
    # every run still starts from nothing.
    #
    # Run it as two commands -- `dbt seed` then `dbt build`:
    # source tests have no dependency edge on seeds, so a single `dbt build`
    # races them and the tests can hit raw.bouts before the seed creates it.
    # A file rather than :memory: is what lets the two invocations share state.
    ci:
      type: duckdb
      path: "target/ci.duckdb"
      threads: 4

    # Deployed. Databricks on Free Edition, which is serverless-only and has no
    # trial clock -- unlike a Snowflake trial, the published project does not go
    # dark after 30 days. Free Edition gives you one pre-created "Serverless
    # Starter Warehouse" and will not let you make another, so http_path points
    # at that one.
    #
    # Where each value comes from:
    #   DATABRICKS_HOST       workspace URL without the scheme
    #                         e.g. dbc-1234abcd-5678.cloud.databricks.com
    #   DATABRICKS_HTTP_PATH  SQL Warehouses -> Serverless Starter Warehouse ->
    #                         Connection details -> HTTP path
    #   DATABRICKS_TOKEN      Settings -> Developer -> Access tokens -> Generate
    #
    # `catalog` is Unity Catalog's extra namespace level: Databricks addresses a
    # table as catalog.schema.table where Snowflake uses database.schema.table.
    # Free Edition requires Unity Catalog, so this is not optional.
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'ufc') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'analytics') }}"
      threads: 8
